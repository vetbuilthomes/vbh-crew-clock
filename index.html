<style>

  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

  main { padding: 12px 12px 32px; max-width: 560px; margin: 0 auto; }

  .status.out { color: #555; }

  .btn.in { background: #2e7d32; color: #fff; }
  .btn.out { background: #b3261e; color: #fff; }
  .btn.sw { background: #fff; color: #1f3a5f; border: 3px solid #1f3a5f; }
  .btn.grey { background: #e4e4e0; color: #1a1a1a; font-weight: normal; font-size: 19px; min-height: 56px; }

  .sheet h3 { font-size: 17px; margin: 14px 0 4px; }
  .sheet ol { margin: 0; padding-left: 24px; font-size: 16px; line-height: 1.4; }
  .sheet ol li { margin: 4px 0; }

  .btn.small { font-size: 18px; padding: 12px; min-height: 52px; }

  .mrow { display: flex; gap: 8px; padding: 10px 0; border-top: 1px solid #eee; }

  .mmain { flex: 1; min-width: 0; font-size: 16px; }

  .st-pending { color: #777; }
  .st-approved { color: #2e7d32; }
  .st-posted { color: #1f3a5f; }
  .otx { color: #b26a00; font-weight: bold; }
  .fl { display: block; font-size: 16px; margin: 12px 0 0; }
  .fl input, .fl textarea { display: block; width: 100%; font-size: 18px; padding: 10px; margin-top: 4px; border: 2px solid #999; border-radius: 8px; font-family: inherit; }

  function lang() { try { return localStorage.getItem(LANG_KEY) === 'es' ? 'es' : 'en'; } catch (e) { return window._lang || 'en'; } }
  function setLang(l) { window._lang = l; try { localStorage.setItem(LANG_KEY, l); } catch (e) {} document.documentElement.lang = l; render(); }
  function t(k, l) { var L = l || lang(); return S[L][k] || S.en[k] || k; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function fmtH(h) { return (Math.round(h * 100) / 100).toFixed(2).replace(/\.?0+$/, ''); }

  // credentials:'omit' sends no Google cookies, so a phone signed into several
  // Google accounts is served like an anonymous one. POST is text/plain: no CORS preflight.
  function apiGet() {
    return fetch(API + '?api=1&t=' + encodeURIComponent(T) + '&_=' + Date.now(), { credentials: 'omit', redirect: 'follow' }).then(done);
  }
  function apiPost(body) {
    body.t = T;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body), credentials: 'omit', redirect: 'follow' }).then(done);
  }
  function done(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json().then(function(s) { if (s && s.error) throw new Error(s.error); return s; });
  }

  function toast(msg, err) {
    var el = $('toast');
    el.textContent = msg; el.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function() { el.className = 'toast' + (err ? ' err' : ''); }, err ? 3500 : 1500);
  }

  // ---------------- location ----------------
  // Asked for as soon as the page loads, so the phone's permission prompt shows

  // ---------------- actions ----------------

  // ---------------- punch list for the clocked-in job (v2026-11-27.1) ----------------

  // One item: English, Spanish under it, location, problem note, who checked it, Problem button. Same as the punch list page.

      (i.checked && i.by ? '<div class="pl-by">✓ ' + esc(i.by) + '</div>' : '') +
      '</span></label>' +
      (!i.checked ? '<div class="pl-row2"><button type="button" class="pl-prob" data-prob-pl="' + esc(id) + '" data-prob-n="' + i.n + '">&#9873; Problem / Problema</button></div>' : '') +
      '</div>';
  }
  function plItem(id, n) { var s = PL.lists[id]; return s && (s.items || []).filter(function(i) { return i.n === n; })[0] || null; }
  function plTap(id, n, checked) {
    var mine = PL, item = plItem(id, n);
    if (!item) return;
    var before = { checked: item.checked, by: item.by, problem: item.problem };
    item.checked = checked; item.by = checked ? STATE.name : ''; item._pending = true;
    if (checked) item.problem = null;
    plRender();
    plSaving++;
    plPost({ id: id, n: n, checked: checked, name: STATE.name }).then(function(s) {
      plSaving--;
      if (s && s.items) mine.lists[id] = s; else if (s && s.closed) mine.lists[id] = s; else item._pending = false;
      if (PL === mine) plRender();
      toast(t('saved'));
    }).catch(function() {
      plSaving--;
      item.checked = before.checked; item.by = before.by; item.problem = before.problem; item._pending = false;
      if (PL === mine) plRender();
      toast(t('notSaved'), true);
    });
  }
  function plProblem(id, n) {
    var mine = PL, item = plItem(id, n);
    if (!item) return;
    $('sheet').innerHTML = '<div id="probSheet"><h2>&#9873; Problem / Problema</h2><div class="meta">' + esc(item.text) + '</div>' +
      '<label class="fl"><textarea id="probInput" rows="3" maxlength="300" placeholder="What&#39;s wrong? / ¿Cuál es el problema?"></textarea></label>' +
      '<button type="button" class="btn in" id="probSave">Save / Guardar</button>' +
      '<button type="button" class="btn grey" id="probCancel">Cancel / Cancelar</button></div>';
    $('modal').className = 'modal show';
    setTimeout(function() { var x = $('probInput'); if (x) x.focus(); }, 50);
    $('probCancel').onclick = closeSheet;
    $('probSave').onclick = function() {
      var note = $('probInput').value.trim();
      if (!note) { $('probInput').focus(); return; }
      var btn = this; btn.disabled = true; btn.textContent = t('saving');
      plSaving++;
      plPost({ action: 'problem', id: id, n: n, note: note, name: STATE.name }).then(function(s) {
        plSaving--;
        if (s && (s.items || s.closed)) mine.lists[id] = s;
        closeSheet();
        if (PL === mine) plRender();
        toast(t('saved'));
      }).catch(function() {
        plSaving--; btn.disabled = false; btn.textContent = 'Save / Guardar';
        toast(t('notSaved'), true);
      });
    };
  }

  // ---------------- job photos (v2026-11-27.1) ----------------
  // Phone camera or gallery, several at once. Each photo is shrunk on the phone, then sent
  // to the clock script, which puts it in the JobTread Files of the job the person is
  // clocked into. The JobTread key stays in the script; this page never sees it.
  var PHOTO = { busy: false, msg: '', cls: '', job: '' };
  var PHOTO_EDGE = 1600, PHOTO_QUALITY = 0.82, PHOTO_BATCH = 20, PHOTO_RAW_MAX = 5 * 1024 * 1024;
  function photoMsg(msg, cls) {
    PHOTO.msg = msg; PHOTO.cls = cls || '';
    var el = $('photoMsg');
    if (el) { el.textContent = msg; el.className = 'pmsg ' + PHOTO.cls; el.style.display = msg ? '' : 'none'; }
    var b = $('btnPhotos'); if (b) b.disabled = PHOTO.busy;
  }
  // Resolves {data: base64, type}. Shrinks to 1600 px on the long side, JPEG. A photo the
  // browser cannot draw (rare) goes as it is when it is small enough, else it fails.
  function photoShrink(file) {
    return new Promise(function(resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function() {
        try {
          var w = img.naturalWidth, h = img.naturalHeight, m = Math.max(w, h), k = m > PHOTO_EDGE ? PHOTO_EDGE / m : 1;
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          var d = c.toDataURL('image/jpeg', PHOTO_QUALITY);
          if (d.indexOf('data:image/jpeg') !== 0) return reject(new Error('no jpeg'));
          resolve({ data: d.slice(d.indexOf(',') + 1), type: 'image/jpeg' });
        } catch (e) { reject(e); }
      };
      img.onerror = function() {
        URL.revokeObjectURL(url);
        if (file.size > PHOTO_RAW_MAX || !/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type)) return reject(new Error('cannot read'));
        var fr = new FileReader();
        fr.onload = function() { var d = String(fr.result || ''); resolve({ data: d.slice(d.indexOf(',') + 1), type: file.type }); };
        fr.onerror = function() { reject(new Error('cannot read')); };
        fr.readAsDataURL(file);
      };
      img.src = url;
    });
  }
  function photosPicked(files) {
    if (PHOTO.busy || !STATE || !STATE.open || !files.length) return;
    var job = STATE.open.jobNumber, over = files.length > PHOTO_BATCH;
    if (over) files = files.slice(0, PHOTO_BATCH);
    var n = files.length, i = 0, ok = 0, fail = 0;
    PHOTO.busy = true; PHOTO.job = job;
    function next() {
      if (i >= n) {
        PHOTO.busy = false;
        var tail = over ? ' ' + t('photoMax').replace('{n}', PHOTO_BATCH) : '';
        if (!fail) photoMsg(t('photoOk').replace('{n}', ok).replace('{job}', job) + tail, 'ok');
        else if (!ok) photoMsg(t('photoFail'), 'err');
        else photoMsg(t('photoPart').replace('{ok}', ok).replace('{fail}', fail) + tail, 'err');
        return;
      }
      var idx = ++i;
      photoMsg(t('photoUp').replace('{i}', idx).replace('{n}', n), '');
      photoShrink(files[idx - 1]).then(function(p) {
        return apiPost({ action: 'photo', data: p.data, type: p.type, i: idx, n: n });
      }).then(function(r) { if (r && r.ok) ok++; else fail++; next(); }, function() { fail++; next(); });
    }
    next();
  }

  // ---------------- events ----------------
  document.addEventListener('click', function(ev) {
    var b = ev.target.closest && ev.target.closest('button');
    if (!b || busy) return;
    if (b.hasAttribute('data-lang')) { setLang(b.getAttribute('data-lang')); return; }
    if (b.hasAttribute('data-job')) {
      var num = b.getAttribute('data-job');
      // Tapping the job that was already pre-selected for you keeps it "auto".
      if (!(picked && picked.number === num && !manualPick)) manualPick = true;
      picked = jobByNumber(num);
      refreshLists();
      return;
    }
    if (b.id === 'btnIn' && picked) { act({ action: 'in', jobNumber: picked.number }, b); return; }
    if (b.id === 'btnOut') { openOutSheet(); return; }
    if (b.id === 'btnSwitch') { openSwitchSheet(); return; }
    if (b.id === 'locBanner') { locSheet(null, GEO === 'denied' ? 1 : 2); return; }
    if (b.id === 'saveDone') { setSavedFlag('vbhClockSaved'); render(); return; }
    if (b.id === 'btnPhotos') { if (!PHOTO.busy && STATE && STATE.open) $('photoInput').click(); return; }
    if (b.hasAttribute('data-prob-pl')) { plProblem(b.getAttribute('data-prob-pl'), Number(b.getAttribute('data-prob-n'))); return; }
  });
  document.addEventListener('change', function(ev) {
    var el = ev.target;
    if (!el) return;
    if (el.id === 'photoInput') {
      var files = Array.prototype.slice.call(el.files || []);   // copy before clearing, so the same photo can be picked again
      el.value = '';
      photosPicked(files);
      return;
    }
    if (el.type === 'checkbox' && el.hasAttribute('data-pl')) plTap(el.getAttribute('data-pl'), Number(el.getAttribute('data-n')), el.checked);
  });
  document.addEventListener('input', function(ev) {
    if (ev.target && ev.target.id === 'jobSearch') { window._q = ev.target.value; refreshLists(); }
  });

  function load(first) {
    if (!T) { STATE = { invalid: true }; render(); return; }
    apiGet().then(function(s) {
      if (busy) return;
      setState(s);
    }).catch(function() {
      if (first) $('app').innerHTML = header() + '<div class="msg">' + esc(t('loadfail')) + '</div>';
    });
  }
  // Fresh state when the page comes back to the front (another phone, or a long gap).
  document.addEventListener('visibilitychange', function() {
    if (!MGR && document.visibilityState === 'visible' && STATE && !busy && $('modal').className === 'modal') load(false);
  });
  // ?m=<token> is the manager view (second script below); the crew clock does not start.
  var MGR = !!(Q.get('m') || '').trim();
  document.documentElement.lang = lang();
  if (!MGR) { if (T) startGeo(); load(true); }
</script>
<script>
  // ---------------- MANAGER VIEW (?m=<token>), v2026-11-26.3, English only ----------------
  // The crew whose Approver is this manager: this week and last week, fix a time
  // (reason required), approve a row or a whole week, unapprove before the bill posts.
  (function() {
    var MT = (Q.get('m') || '').trim();
    if (!MT) return;
    var V = null, WK = 1, mbusy = false;    // WK 0 this week, 1 last week (the week to approve on Monday)
    function mget() {
      return fetch(API + '?api=1&m=' + encodeURIComponent(MT) + '&_=' + Date.now(), { credentials: 'omit', redirect: 'follow' }).then(done);
    }
    function mpost(body) {
      body.action = 'mgr'; body.m = MT;
      return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body), credentials: 'omit', redirect: 'follow' }).then(done);
    }
    var WARN = { not_found: 'That row is not one of your crew’s.', posted: 'Already on a bill; it cannot change.',
                 locked: 'Approved rows are locked. Unapprove it first.', reason_required: 'Type a reason for the change.',
                 bad_time: 'Clock out has to be after clock in, not in the future, and the shift under 24 hours.',
                 not_open: 'They are not clocked in any more.', unknown_op: 'Not done.' };
    function flagsHtml(f) {
      if (!f) return '';
      return '<div class="mflags">' + f.split(/\s*[;,]\s*/).filter(Boolean).map(function(x) {
        return '<span class="' + (x === 'Edited' ? 'edited' : 'red') + '">' + esc(x) + '</span>'; }).join('') + '</div>';
    }
    function mrender() {
      if (!V) return;
      document.title = 'VBH Crew Hours';
      if (V.invalid) { $('app').innerHTML = '<header><h1>VBH Crew Hours</h1></header><div class="msg" id="invalid">Link not valid.</div>'; return; }
      var w = V.weeks[WK];
      var h = '<header><div style="flex:1"><h1>VBH Crew Hours</h1><div class="sub">' + esc(V.manager) + '</div></div></header><main>' +
        saveBox('vbhMgrSaved', 'en', 'mSaveDone', 'saveWhyMgr');
      h += '<div class="tabs">' + V.weeks.map(function(x, i) {
        return '<button type="button" class="tab' + (i === WK ? ' on' : '') + '" data-wk="' + i + '">' + esc(x.label) + '<br><small>' + esc(x.title) + '</small></button>'; }).join('') + '</div>';
      if (!w.people.length) h += '<div class="card empty">No crew members list you as their approver.</div>';
      w.people.forEach(function(p) {
        h += '<div class="card person" data-person="' + esc(p.token) + '"><div class="phead"><div><b class="pname">' + esc(p.name) + '</b><div class="meta">Total <b>' + fmtH(p.totals.hours) +
          ' h</b> · Regular ' + fmtH(p.totals.reg) + ' · <span class="' + (p.totals.ot > 0 ? 'otx' : '') + '">OT ' + fmtH(p.totals.ot) + '</span></div></div></div>';
        if (p.pending) h += '<button type="button" class="btn in small" data-approve-week="' + esc(p.token) + '">Approve all (' + p.pending + ' pending)</button>';
        var day = '';
        p.rows.forEach(function(r) {
          if (r.day !== day) { day = r.day; h += '<h3 class="day">' + esc(day) + '</h3>'; }
          h += '<div class="mrow' + (r._saving ? ' saving' : '') + '" data-row="' + r.row + '"><div class="mmain"><div><b>' + esc(r.job) + '</b> ' + esc(r.jobName) + '</div>' +
            '<div class="meta">' + esc(r.inTime) + ' – ' + esc(r.outTime) + ' · <b>' + fmtH(r.hours) + ' h</b>' +
            (r.reg != null && (r.status !== 'Pending') ? ' (' + fmtH(r.reg) + ' reg' + (r.ot ? ', <span class="otx">' + fmtH(r.ot) + ' OT</span>' : '') + ')' : '') + '</div>' +
            flagsHtml(r.flags) +
            '<div class="st st-' + r.status.toLowerCase() + '">' + esc(r.status) +
            (r.status === 'Approved' ? ' by ' + esc(r.approvedBy) + ' ' + esc(r.approvedAt) : '') +
            (r.status === 'Posted' ? ' · ' + esc(r.bill) : '') + (r._saving ? ' · saving…' : '') + '</div></div><div class="macts">';
          if (r._saving) h += '';
          else if (r.status === 'Pending') h += '<button type="button" class="mb ok" data-approve="' + r.row + '">Approve</button><button type="button" class="mb" data-edit="' + r.row + '">Edit time</button>';
          else if (r.status === 'Approved') h += '<button type="button" class="mb" data-unapprove="' + r.row + '">Unapprove</button>';
          h += '</div></div>';
        });
        p.open.forEach(function(o) {
          h += '<div class="mrow open"><div class="mmain"><div><b>' + esc(o.job) + '</b> ' + esc(o.jobName) + '</div><div class="meta">' + esc(o.day) + ' ' + esc(o.inTime) + ' – now · ' + fmtH(o.hours) + ' h</div>' + flagsHtml(o.flags) + '</div>' +
            '<div class="macts"><button type="button" class="mb ok" data-close="' + esc(o.token) + '">Close shift</button></div></div>';
        });
        if (!p.rows.length && !p.open.length) h += '<div class="empty" style="padding:6px 0">No hours this week.</div>';
        h += '</div>';
      });
      h += '<div class="foot">' + esc(V.version || '') + '</div></main>';
      $('app').innerHTML = h;
    }
    function findRow(n) {
      var out = null;
      V.weeks.forEach(function(w) { w.people.forEach(function(p) { p.rows.forEach(function(r) { if (r.row === n) out = { r: r, p: p }; }); }); });
      return out;
    }
    function mact(body, okMsg) {
      if (mbusy) return Promise.resolve();
      mbusy = true;
      return mpost(body).then(function(v) {
        mbusy = false;
        if (v.invalid) { V = v; mrender(); return; }
        V = v; mrender();
        if (v.warn) toast(WARN[v.warn] || 'Not done.', true); else toast(okMsg || 'Saved');
        return v;
      }).catch(function() { mbusy = false; toast('Not saved, try again', true); });
    }
    // Show the result the moment the button is tapped (the save itself takes about 10 s), marked
    // "saving…". The server's answer then replaces it; a failed save puts the page back as it was.
    function instant(change, body, okMsg) {
      if (mbusy) return;
      var snap = JSON.stringify(V);
      change();
      mrender();
      mact(body, okMsg).then(function(v) { if (!v) { V = JSON.parse(snap); mrender(); } });
    }
    function personOf(token) { return V.weeks[WK].people.filter(function(p) { return p.token === token; })[0] || null; }
    // A shift someone forgot to clock out of: the real clock-out time and a reason (v2026-11-26.13).
    function closeSheetFor(token) {
      var x = null;
      V.weeks.forEach(function(w) { w.people.forEach(function(p) { p.open.forEach(function(o) { if (o.token === token) x = { o: o, p: p }; }); }); });
      if (!x) return;
      var o = x.o;
      $('sheet').innerHTML = '<div id="closeSheet"><h2>Close shift: ' + esc(x.p.name) + '</h2><div class="meta">Clocked in ' + esc(o.day) + ' ' + esc(o.inTime) +
        ' on job ' + esc(o.job) + ' ' + esc(o.jobName) + ', still open (' + fmtH(o.hours) + ' h).</div>' +
        '<label class="fl">Real clock-out time<input type="datetime-local" id="cOut" value="' + esc(o.nowEdit) + '" min="' + esc(o.inEdit) + '"></label>' +
        '<label class="fl">Reason (required)<textarea id="cReason" rows="2" placeholder="e.g. forgot to clock out, left site at 3:30 per text"></textarea></label>' +
        '<div class="meta">It is saved as a pending row flagged Edited and closed by manager; approve it as usual.</div>' +
        '<button type="button" class="btn in" id="cSave">Save</button><button type="button" class="btn grey" id="cCancel">Cancel</button></div>';
      $('modal').className = 'modal show';
      $('cCancel').onclick = closeSheet;
      $('cSave').onclick = function() {
        var reason = $('cReason').value.trim();
        if (reason.length < 3) { toast(WARN.reason_required, true); $('cReason').focus(); return; }
        this.disabled = true; this.textContent = 'Saving…';
        mact({ op: 'closeShift', token: token, outAt: $('cOut').value, reason: reason }, 'Shift closed').then(function(v) {
          if (v && !v.warn) closeSheet(); else { var b = $('cSave'); if (b) { b.disabled = false; b.textContent = 'Save'; } }
        });
      };
    }
    function editSheet(n) {
      var x = findRow(n); if (!x) return;
      var r = x.r;
      $('sheet').innerHTML = '<div id="editSheet"><h2>Edit time: ' + esc(x.p.name) + '</h2><div class="meta">' + esc(r.day) + ' · job ' + esc(r.job) + ' ' + esc(r.jobName) + '</div>' +
        '<label class="fl">Clock in<input type="datetime-local" id="eIn" value="' + esc(r.inEdit) + '"></label>' +
        '<label class="fl">Clock out<input type="datetime-local" id="eOut" value="' + esc(r.outEdit) + '"></label>' +
        '<label class="fl">Reason (required)<textarea id="eReason" rows="2" placeholder="e.g. forgot to clock out, left site at 3:30"></textarea></label>' +
        '<div class="meta">The original times are kept in the Log tab and the row is flagged Edited.</div>' +
        '<button type="button" class="btn in" id="eSave">Save</button><button type="button" class="btn grey" id="eCancel">Cancel</button></div>';
      $('modal').className = 'modal show';
      $('eCancel').onclick = closeSheet;
      $('eSave').onclick = function() {
        var reason = $('eReason').value.trim();
        if (reason.length < 3) { toast(WARN.reason_required, true); $('eReason').focus(); return; }
        var body = { op: 'edit', row: n, reason: reason };
        if ($('eIn').value !== r.inEdit) body.inAt = $('eIn').value;
        if ($('eOut').value !== r.outEdit) body.outAt = $('eOut').value;
        if (!body.inAt && !body.outAt) { toast('Nothing changed.', true); return; }
        this.disabled = true; this.textContent = 'Saving…';
        mact(body, 'Time changed').then(function(v) { if (v && !v.warn) closeSheet(); else { var b = $('eSave'); if (b) { b.disabled = false; b.textContent = 'Save'; } } });
      };
    }
    document.addEventListener('click', function(ev) {
      var b = ev.target.closest && ev.target.closest('button');
      if (!b || mbusy || !V) return;
      if (b.id === 'mSaveDone') { setSavedFlag('vbhMgrSaved'); mrender(); return; }
      if (b.hasAttribute('data-wk')) { WK = Number(b.getAttribute('data-wk')); mrender(); return; }
      if (b.hasAttribute('data-approve')) {
        var an = Number(b.getAttribute('data-approve')), ax = findRow(an);
        instant(function() { if (ax) { ax.r.status = 'Approved'; ax.r.approvedBy = V.manager; ax.r.approvedAt = ''; ax.r._saving = true; ax.p.pending = Math.max(0, ax.p.pending - 1); } },
                { op: 'approve', row: an }, 'Approved');
        return;
      }
      if (b.hasAttribute('data-unapprove')) {
        var un = Number(b.getAttribute('data-unapprove')), ux = findRow(un);
        instant(function() { if (ux) { ux.r.status = 'Pending'; ux.r._saving = true; ux.p.pending++; } },
                { op: 'unapprove', row: un }, 'Back to pending');
        return;
      }
      if (b.hasAttribute('data-approve-week')) {
        var wt = b.getAttribute('data-approve-week'), wp = personOf(wt);
        instant(function() { if (wp) { wp.rows.forEach(function(r) { if (r.status === 'Pending') { r.status = 'Approved'; r.approvedBy = V.manager; r.approvedAt = ''; r._saving = true; } }); wp.pending = 0; } },
                { op: 'approveWeek', token: wt, week: V.weeks[WK].mon }, 'Week approved');
        return;
      }
      if (b.hasAttribute('data-edit')) { editSheet(Number(b.getAttribute('data-edit'))); return; }
      if (b.hasAttribute('data-close')) { closeSheetFor(b.getAttribute('data-close')); return; }
    });
    window.MANAGER_MODE = true;
    // The home screen name for a manager. Android Chrome takes it from application-name (it
    // offered "VBH Clock" on Mark's phone when only the Apple one was changed), iPhone from the Apple one.
    ['appTitle', 'appName'].forEach(function(id) { var el = $(id); if (el) el.setAttribute('content', 'VBH Hours'); });
    mget().then(function(v) { V = v; mrender(); })
      .catch(function() { $('app').innerHTML = '<div class="msg">Could not load. Check your signal and reload.</div>'; });
  })();
</script>
