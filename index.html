<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>VBH Crew Clock</title>
<!--
  VBH crew clock-in page. Source: Claude Projects/crew-clock/web/index.html,
  published to GitHub Pages (repo vetbuilthomes/vbh-crew-clock) by
  crew-clock/publish-page.sh. All data comes from the Apps Script JSON API
  below; nothing about any person or job is in this file.
  Mode: ?t=<token>   one crew member's clock (the token is the person; no login)
-->
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
         font-size: 18px; color: #1a1a1a; background: #f4f4f2; }
  header { background: #1f3a5f; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 20px; margin: 0; flex: 1; line-height: 1.25; }
  header .sub { font-size: 15px; opacity: .9; }
  .lang { display: flex; border: 2px solid rgba(255,255,255,.7); border-radius: 8px; overflow: hidden; }
  .lang button { font-size: 15px; padding: 8px 12px; min-height: 40px; border: 0; background: transparent; color: #fff; }
  .lang button.on { background: #fff; color: #1f3a5f; font-weight: bold; }
  main { padding: 12px 12px 32px; max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin: 10px 0; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .status { font-size: 24px; font-weight: bold; }
  .status.in { color: #2e7d32; }
  .status.out { color: #555; }
  .big { font-size: 19px; margin-top: 6px; line-height: 1.35; }
  .meta { font-size: 16px; color: #555; margin-top: 4px; }
  .total { font-size: 18px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #e4e4e0; }
  .banner { background: #fff3cd; border: 2px solid #b26a00; color: #6b4000; border-radius: 12px; padding: 14px; margin: 10px 0; font-size: 17px; }
  .btn { display: block; width: 100%; font-size: 22px; font-weight: bold; padding: 18px; min-height: 64px; border: 0;
         border-radius: 12px; margin-top: 12px; font-family: inherit; }
  .btn.in { background: #2e7d32; color: #fff; }
  .btn.out { background: #b3261e; color: #fff; }
  .btn.sw { background: #fff; color: #1f3a5f; border: 3px solid #1f3a5f; }
  .btn.grey { background: #e4e4e0; color: #1a1a1a; font-weight: normal; font-size: 19px; min-height: 56px; }
  .btn:disabled { opacity: .45; }
  .search { width: 100%; font-size: 19px; padding: 12px; border: 2px solid #999; border-radius: 10px; font-family: inherit; margin-top: 8px; }
  .jobs { max-height: 50vh; overflow-y: auto; margin-top: 8px; border: 1px solid #e4e4e0; border-radius: 10px; }
  .job { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font-size: 18px; padding: 12px 14px; min-height: 56px;
         border: 0; border-bottom: 1px solid #eee; background: #fff; font-family: inherit; }
  .job .num { font-weight: bold; color: #1f3a5f; flex: 0 0 64px; }
  .job .jtxt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .job .addr { font-size: 14px; color: #666; margin-top: 2px; }
  .job .dist { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 14px; color: #555; }
  .job .here { background: #2e7d32; color: #fff; font-weight: bold; font-size: 13px; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
  .job .mi { white-space: nowrap; }
  .job.sel { background: #e3efe4; outline: 3px solid #2e7d32; outline-offset: -3px; }
  .job:last-child { border-bottom: 0; }
  .empty { color: #777; padding: 14px; font-size: 16px; }
  .shift { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 16px; }
  .shift:last-child { border-bottom: 0; }
  .shift .flag { color: #b26a00; font-size: 14px; }
  h2 { font-size: 16px; color: #1f3a5f; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  .locb { display: block; width: 100%; text-align: left; font-family: inherit; cursor: pointer; }
  .sheet h3 { font-size: 17px; margin: 14px 0 4px; }
  .sheet ol { margin: 0; padding-left: 24px; font-size: 16px; line-height: 1.4; }
  .sheet ol li { margin: 4px 0; }
  .sheet .why { font-size: 17px; margin: 0 0 6px; color: #6b4000; }
  .sheet .nogps { text-align: center; margin: 14px 0 4px; font-size: 15px; }
  .sheet .nogps a { color: #555; }
  .sheet .other { margin-top: 22px; padding-top: 12px; border-top: 2px solid #e4e4e0; color: #444; }
  .sheet .other h2 { font-size: 17px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal.show { display: flex; }
  .sheet { background: #fff; border-radius: 16px 16px 0 0; padding: 20px 16px 28px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
  .sheet h2 { font-size: 20px; text-transform: none; letter-spacing: 0; color: #1a1a1a; margin-bottom: 10px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2e7d32; color: #fff;
           padding: 12px 22px; border-radius: 24px; font-size: 18px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; max-width: 92vw; text-align: center; }
  .toast.err { background: #b3261e; }
  .toast.show { opacity: 1; }
  .msg { padding: 48px 20px; text-align: center; font-size: 21px; }
  .foot { text-align: center; color: #888; font-size: 13px; margin-top: 20px; }
</style>
</head>
<body>
<div id="app"><div class="msg" id="loading">Loading… / Cargando…</div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
  // Apps Script deployment (vetbuilthomes@gmail.com, "VBH Crew Clock"). Redeployed in
  // place with clasp deploy -i, so this URL never changes. Set once by publish-page.sh's
  // first run (see crew-clock/PROJECT.md).
  var API = 'https://script.google.com/macros/s/AKfycbw3O4dwJNVsGJfzg09kPYVpXp8IH5Dm7foQUvT9XiGuPPq6wzgAutV16U2fkFPNfYfh/exec';
  var Q = new URLSearchParams(location.search);
  var T = (Q.get('t') || '').trim();
  var LANG_KEY = 'vbhClockLang';
  var STATE = null, busy = false, picked = null, pickMode = 'in', tick = null;
  // Location (v2026-11-26.2). FIX is the latest position from the phone; GEO is
  // 'waiting', 'ok', 'denied' (blocked for this site) or 'off' (no fix: location off,
  // no signal, unsupported). AUTO is the job number within HERE_METERS of FIX, if any.
  // manualPick: the person tapped a job, so a later fix never changes their choice.
  var FIX = null, GEO = 'waiting', AUTO = null, manualPick = false;
  var HERE_METERS = 300, FIX_FRESH_MS = 60000, FIX_WAIT_MS = 20000;

  var S = {
    en: { title: 'VBH Crew Clock', invalid: 'Link not valid, ask your PM', loadfail: 'Could not load. Check your signal and reload.',
          clockedIn: 'Clocked IN', clockedOut: 'Clocked OUT', since: 'since', onJob: 'on', hoursSoFar: 'h so far',
          today: 'Today', todayTotal: 'Today’s total', hours: 'h', noShifts: 'No shifts yet today.',
          clockIn: 'Clock In', clockOut: 'Clock Out', switchJob: 'Switch Job', pickJob: 'Pick the job', search: 'Search job number, name or address',
          noJobs: 'No job matches.', jobsErr: 'Job list unavailable. Try again in a minute.', cancel: 'Cancel', close: 'Close',
          outOf: 'Clock out of', switchTo: 'Switch to', youHere: 'You’re here',
          gettingGps: 'Getting location…', saving: 'Saving…', saved: 'Saved', notSaved: 'Not saved, try again',
          longShift: 'You have been clocked in for over {h} hours. Forgot to clock out? Clock out now and tell your PM.',
          alreadyIn: 'You were already clocked in.', notIn: 'You were not clocked in.', unknownJob: 'That job is not on the list any more.',
          sameJob: 'You are already on that job.', lunch: 'lunch', minutes: 'min', noGps: 'no GPS', flagLong: 'long shift', flagLunch: 'lunch capped',
          locBanner: 'Location is off or blocked. Tap here to see how to turn it on.',
          locTitle: 'Location is needed', locBlocked: 'Location is blocked for this page.', locNoFix: 'Could not get your location.',
          locAndroidH: 'Android phone (Chrome)',
          locAndroid: ['Turn on Location: swipe down from the top of the screen and tap Location.',
                       'In Chrome, tap the icon to the left of the web address (a lock or two sliders), then Permissions (or Site settings), then Location, then Allow.',
                       'Come back here and tap Try again.'],
          locIphoneH: 'iPhone (Safari)',
          locIphone: ['Open Settings, then Privacy & Security, then Location Services. Turn it On, then tap Safari Websites and choose While Using the App.',
                      'Back in Safari, tap aA to the left of the web address, then Website Settings, then Location, then Allow.',
                      'Come back here and tap Try again.'],
          tryAgain: 'Try again', withoutIn: 'Clock in without location', withoutOut: 'Clock out without location', withoutSw: 'Switch without location' },
    es: { title: 'Reloj de cuadrilla VBH', invalid: 'Enlace no válido, pregunta a tu PM', loadfail: 'No se pudo cargar. Revisa tu señal y recarga.',
          clockedIn: 'Marcado ENTRADA', clockedOut: 'Marcado SALIDA', since: 'desde', onJob: 'en', hoursSoFar: 'h hasta ahora',
          today: 'Hoy', todayTotal: 'Total de hoy', hours: 'h', noShifts: 'Sin turnos todavía hoy.',
          clockIn: 'Marcar entrada', clockOut: 'Marcar salida', switchJob: 'Cambiar de trabajo', pickJob: 'Elige el trabajo', search: 'Busca número, nombre o dirección',
          noJobs: 'Ningún trabajo coincide.', jobsErr: 'Lista de trabajos no disponible. Intenta en un minuto.', cancel: 'Cancelar', close: 'Cerrar',
          outOf: 'Marcar salida de', switchTo: 'Cambiar a', youHere: 'Está aquí',
          gettingGps: 'Obteniendo ubicación…', saving: 'Guardando…', saved: 'Guardado', notSaved: 'No guardado, intenta otra vez',
          longShift: 'Llevas más de {h} horas marcado. ¿Olvidaste marcar salida? Marca salida ahora y avisa a tu PM.',
          alreadyIn: 'Ya estabas marcado.', notIn: 'No estabas marcado.', unknownJob: 'Ese trabajo ya no está en la lista.',
          sameJob: 'Ya estás en ese trabajo.', lunch: 'almuerzo', minutes: 'min', noGps: 'sin GPS', flagLong: 'turno largo', flagLunch: 'almuerzo ajustado',
          locBanner: 'La ubicación está apagada o bloqueada. Toca aquí para ver cómo activarla.',
          locTitle: 'Se necesita la ubicación', locBlocked: 'La ubicación está bloqueada para esta página.', locNoFix: 'No se pudo obtener tu ubicación.',
          locAndroidH: 'Teléfono Android (Chrome)',
          locAndroid: ['Activa la Ubicación: desliza hacia abajo desde arriba de la pantalla y toca Ubicación.',
                       'En Chrome, toca el ícono a la izquierda de la dirección web (un candado o dos controles), luego Permisos (o Configuración del sitio), luego Ubicación y Permitir.',
                       'Vuelve aquí y toca Intentar otra vez.'],
          locIphoneH: 'iPhone (Safari)',
          locIphone: ['Abre Configuración, luego Privacidad y seguridad, luego Localización. Actívala, luego toca Sitios web de Safari y elige Cuando se use la app.',
                      'En Safari, toca aA a la izquierda de la dirección web, luego Configuración del sitio web, luego Ubicación y Permitir.',
                      'Vuelve aquí y toca Intentar otra vez.'],
          tryAgain: 'Intentar otra vez', withoutIn: 'Marcar entrada sin ubicación', withoutOut: 'Marcar salida sin ubicación', withoutSw: 'Cambiar sin ubicación' }
  };
  function lang() { try { return localStorage.getItem(LANG_KEY) === 'es' ? 'es' : 'en'; } catch (e) { return window._lang || 'en'; } }
  function setLang(l) { window._lang = l; try { localStorage.setItem(LANG_KEY, l); } catch (e) {} document.documentElement.lang = l; render(); }
  function t(k, l) { var L = l || lang(); return S[L][k] || S.en[k] || k; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function fmtH(h) { return (Math.round(h * 100) / 100).toFixed(2).replace(/\.?0+$/, ''); }

  // credentials:'omit' sends no Google cookies, so a phone signed into several
  // Google accounts is served like an anonymous one. POST is text/plain: no CORS preflight.
  function apiGet() {
    return fetch(API + '?api=1&t=' + encodeURIComponent(T) + '&_=' + Date.now(), { credentials: 'omit', redirect: 'follow' }).then(done);
  }
  function apiPost(body) {
    body.t = T;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body), credentials: 'omit', redirect: 'follow' }).then(done);
  }
  function done(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json().then(function(s) { if (s && s.error) throw new Error(s.error); return s; });
  }

  function toast(msg, err) {
    var el = $('toast');
    el.textContent = msg; el.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function() { el.className = 'toast' + (err ? ' err' : ''); }, err ? 3500 : 1500);
  }

  // ---------------- location ----------------
  // Asked for as soon as the page loads, so the phone's permission prompt shows
  // up before anyone taps a button (a tap used to save before the prompt was answered).
  function fixFrom(p) { return { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, at: Date.now() }; }
  function startGeo() {
    if (!navigator.geolocation) { GEO = 'off'; return; }
    try {
      navigator.geolocation.watchPosition(function(p) { FIX = fixFrom(p); GEO = 'ok'; onFix(); },
        function(e) { if (e && e.code === 1) { GEO = 'denied'; onFix(); } else if (!FIX) { GEO = 'off'; onFix(); } },
        { enableHighAccuracy: true, maximumAge: 15000, timeout: FIX_WAIT_MS });
    } catch (e) { GEO = 'off'; }
  }
  // For a save: a fix less than a minute old, or wait up to 20 s for a new one.
  // Rejects with { code } (1 blocked, 2 unavailable, 3 timed out, 0 unsupported).
  function fixForSave() {
    return new Promise(function(resolve, reject) {
      if (FIX && Date.now() - FIX.at < FIX_FRESH_MS) return resolve(FIX);
      if (!navigator.geolocation) return reject({ code: 0 });
      var finished = false;
      var guard = setTimeout(function() { if (!finished) { finished = true; reject({ code: 3 }); } }, FIX_WAIT_MS + 1000);
      navigator.geolocation.getCurrentPosition(function(p) {
        if (finished) return; finished = true; clearTimeout(guard);
        FIX = fixFrom(p); GEO = 'ok'; resolve(FIX);
      }, function(e) {
        if (finished) return; finished = true; clearTimeout(guard);
        if (e && e.code === 1) GEO = 'denied';
        reject({ code: e ? e.code : 2 });
      }, { enableHighAccuracy: true, timeout: FIX_WAIT_MS, maximumAge: 30000 });
    });
  }
  function gpsOut(f) { return f ? { lat: f.lat, lng: f.lng, acc: f.acc } : null; }

  // Metres between two points (haversine).
  function meters(aLat, aLng, bLat, bLng) {
    var R = 6371000, r = Math.PI / 180;
    var dLat = (bLat - aLat) * r, dLng = (bLng - aLng) * r;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function distOf(j) {
    if (!FIX || j.lat == null || j.lng == null) return null;
    return meters(FIX.lat, FIX.lng, Number(j.lat), Number(j.lng));
  }
  function miles(m) {
    var mi = m / 1609.344;
    return mi < 0.1 ? '<0.1 mi' : (mi < 10 ? mi.toFixed(1) : String(Math.round(mi))) + ' mi';
  }
  // Closest job first once the phone has a fix; jobs with no coordinates last.
  // Without a fix, the server's order (job number, newest first).
  function sortedJobs() {
    var jobs = (STATE && STATE.jobs || []).slice();
    if (!FIX) return jobs;
    var withD = [], without = [];
    jobs.forEach(function(j) { var d = distOf(j); if (d === null) without.push(j); else { j._d = d; withD.push(j); } });
    withD.sort(function(a, b) { return a._d - b._d; });
    return withD.concat(without);
  }
  function findAuto() {
    if (!FIX) return null;
    var best = null;
    (STATE && STATE.jobs || []).forEach(function(j) { var d = distOf(j); if (d !== null && d <= HERE_METERS && (!best || d < best.d)) best = { j: j, d: d }; });
    return best ? best.j.number : null;
  }
  function jobByNumber(n) { return (STATE && STATE.jobs || []).filter(function(j) { return j.number === n; })[0] || null; }
  // Pre-select the job the phone is standing on, unless the person already chose one.
  function applyAuto() {
    AUTO = findAuto();
    if (manualPick || !AUTO || !STATE || STATE.invalid) return;
    if (pickMode === 'switch') { if (STATE.open && STATE.open.jobNumber === AUTO) return; picked = jobByNumber(AUTO); }
    else if (!STATE.open) picked = jobByNumber(AUTO);
  }
  function onFix() {
    if (!STATE || STATE.invalid || busy) return;
    applyAuto();
    refreshLists();
    var lb = $('locBanner'); if (lb) lb.style.display = GEO === 'denied' || GEO === 'off' ? '' : 'none';
  }

  // ---------------- render ----------------
  function header() {
    var l = lang();
    return '<header><div style="flex:1"><h1>' + esc(t('title')) + '</h1>' +
      (STATE && STATE.name ? '<div class="sub">' + esc(STATE.name) + '</div>' : '') + '</div>' +
      '<div class="lang"><button type="button" data-lang="en" class="' + (l === 'en' ? 'on' : '') + '">EN</button>' +
      '<button type="button" data-lang="es" class="' + (l === 'es' ? 'on' : '') + '">ES</button></div></header>';
  }

  function render() {
    if (!STATE) return;
    document.title = t('title');
    if (STATE.invalid) {
      $('app').innerHTML = header() + '<div class="msg" id="invalid">' + esc(t('invalid')) + '</div>';
      return;
    }
    if (pickMode === 'in') applyAuto();
    var o = STATE.open, h = header() + '<main>';
    if (o && o.longShift) h += '<div class="banner" id="longShift">&#9888; ' + esc(t('longShift').replace('{h}', STATE.longShiftHours)) + '</div>';
    h += '<button type="button" class="banner locb" id="locBanner"' + (GEO === 'denied' || GEO === 'off' ? '' : ' style="display:none"') + '>&#9888; ' + esc(t('locBanner')) + '</button>';
    h += '<div class="card">';
    if (o) {
      h += '<div class="status in" id="status">' + esc(t('clockedIn')) + '</div>' +
        '<div class="big">' + esc(t('onJob')) + ' <b>' + esc(o.jobNumber) + '</b> ' + esc(o.jobName) + '</div>' +
        '<div class="meta">' + esc(t('since')) + ' ' + esc(o.inTime) + (o.inDate !== STATE.today ? ' (' + esc(o.inDate) + ')' : '') +
        ' · <span id="elapsed">' + fmtH(liveHours()) + '</span> ' + esc(t('hoursSoFar')) + '</div>';
    } else {
      h += '<div class="status out" id="status">' + esc(t('clockedOut')) + '</div>';
    }
    h += '<div class="total">' + esc(t('todayTotal')) + ': <b id="todayTotal">' + fmtH(liveTotal()) + ' ' + esc(t('hours')) + '</b></div></div>';
    if (o) {
      h += '<button type="button" class="btn out" id="btnOut">' + esc(t('clockOut')) + '</button>' +
           '<button type="button" class="btn sw" id="btnSwitch">' + esc(t('switchJob')) + '</button>';
    } else {
      h += '<div class="card"><h2>' + esc(t('pickJob')) + '</h2>' + picker() + '</div>' +
           '<button type="button" class="btn in" id="btnIn"' + (picked ? '' : ' disabled') + '>' + inLabel() + '</button>';
    }
    h += '<div class="card"><h2>' + esc(t('today')) + '</h2>';
    var sh = STATE.shifts || [];
    if (!sh.length) h += '<div class="empty" style="padding:4px 0">' + esc(t('noShifts')) + '</div>';
    sh.forEach(function(s) {
      h += '<div class="shift"><div><b>' + esc(s.jobNumber) + '</b> ' + esc(s.jobName) + '<br><span class="meta">' + esc(s.inTime) + ' – ' + esc(s.outTime) + '</span>' +
        (s.flags ? '<br><span class="flag">' + esc(flagsText(s.flags)) + '</span>' : '') + '</div><div><b>' + fmtH(s.hours) + ' ' + esc(t('hours')) + '</b></div></div>';
    });
    h += '</div><div class="foot">' + esc(STATE.version || '') + '</div></main>';
    $('app').innerHTML = h;
    var inp = $('jobSearch'); if (inp && window._q) { inp.value = window._q; }
    clearInterval(tick);
    if (o) tick = setInterval(function() {
      var e = $('elapsed'), tt = $('todayTotal');
      if (e) e.textContent = fmtH(liveHours());
      if (tt) tt.textContent = fmtH(liveTotal()) + ' ' + t('hours');
    }, 30000);
  }
  function inLabel() { return esc(t('clockIn')) + (picked ? ': ' + esc(picked.number) : ''); }

  function flagsText(f) {
    return f.split(',').map(function(x) { x = x.trim();
      return x === 'no GPS' ? t('noGps') : x === 'long shift' ? t('flagLong') : x === 'lunch capped' ? t('flagLunch') : x; }).join(', ');
  }
  // Hours since clock-in, counted from the server's clock so the phone's clock does not matter.
  function liveHours() {
    if (!STATE.open) return 0;
    var base = STATE.open.hours, drift = (Date.now() - STATE._receivedAt) / 3600000;
    return base + Math.max(0, drift);
  }
  function liveTotal() { return (STATE.todayHours - (STATE.open ? STATE.open.hours : 0)) + liveHours(); }

  function jobRows() {
    var q = (window._q || '').toLowerCase().trim();
    var jobs = sortedJobs().filter(function(j) {
      return !q || j.number.toLowerCase().indexOf(q) !== -1 || j.name.toLowerCase().indexOf(q) !== -1 ||
        String(j.address || '').toLowerCase().indexOf(q) !== -1;
    });
    var h = '';
    if (STATE.jobsError && !(STATE.jobs || []).length) h += '<div class="empty">' + esc(t('jobsErr')) + '</div>';
    else if (!jobs.length) h += '<div class="empty">' + esc(t('noJobs')) + '</div>';
    jobs.slice(0, 200).forEach(function(j) {
      var sel = picked && picked.number === j.number, d = distOf(j), here = AUTO === j.number;
      h += '<button type="button" class="job' + (sel ? ' sel' : '') + '" data-job="' + esc(j.number) + '">' +
        '<span class="num">' + esc(j.number) + '</span>' +
        '<span class="jtxt"><span class="jname">' + esc(j.name) + '</span>' +
        (j.address ? '<span class="addr">' + esc(j.address) + '</span>' : '') + '</span>' +
        '<span class="dist">' + (here ? '<span class="here">' + esc(t('youHere')) + '</span>' : '') +
        (d !== null ? '<span class="mi">' + esc(miles(d)) + '</span>' : '') + '</span></button>';
    });
    return h;
  }
  function picker() {
    return '<input class="search" id="jobSearch" placeholder="' + esc(t('search')) + '" autocomplete="off" inputmode="search">' +
      '<div class="jobs" id="jobs">' + jobRows() + '</div>';
  }
  // Redraw only the job list and its button, so typing in the search box is not interrupted.
  function refreshLists() {
    var box = $('jobs'); if (!box) return;
    box.innerHTML = jobRows();
    var bi = $('btnIn'); if (bi && !busy) { bi.disabled = !picked; bi.innerHTML = inLabel(); }
    var ds = $('doSwitch'); if (ds && !busy) { ds.disabled = !picked; ds.textContent = t('switchJob') + (picked ? ': ' + picked.number : ''); }
  }

  // ---------------- actions ----------------
  // Wait for a location, then save. No location: the help screen, never a silent "no GPS".
  function act(body, btn) {
    if (busy) return;
    busy = true;
    var orig = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.textContent = t('gettingGps'); }
    fixForSave().then(function(f) { save(body, gpsOut(f), btn, orig); },
      function(e) { busy = false; if (btn) { btn.disabled = false; btn.innerHTML = orig; } locSheet(body, e && e.code); });
  }
  function save(body, g, btn, orig) {
    busy = true;
    if (btn) { btn.disabled = true; btn.textContent = t('saving'); }
    body.gps = g;
    // auto: the page pre-selected this job (within 300 m) and the person did not choose another.
    if (body.jobNumber) body.pick = !manualPick && body.jobNumber === AUTO ? 'auto' : 'manual';
    apiPost(body).then(function(s) {
      busy = false; picked = null; manualPick = false; window._q = '';
      closeSheet();
      setState(s);
      if (s.warn === 'already_in') toast(t('alreadyIn'), true);
      else if (s.warn === 'not_in') toast(t('notIn'), true);
      else if (s.warn === 'unknown_job') toast(t('unknownJob'), true);
      else if (s.warn === 'same_job') toast(t('sameJob'), true);
      else toast(t('saved'));
    }).catch(function() {
      busy = false;
      if (btn) { btn.disabled = false; btn.innerHTML = orig || btn.innerHTML; }
      toast(t('notSaved'), true);
    });
  }

  function locHelp(l) {
    function list(a) { return '<ol>' + a.map(function(x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>'; }
    return '<h3>' + esc(t('locAndroidH', l)) + '</h3>' + list(t('locAndroid', l)) +
           '<h3>' + esc(t('locIphoneH', l)) + '</h3>' + list(t('locIphone', l));
  }
  // The location screen: why, how to turn it on (both languages, the chosen one first),
  // Try again, and a small way through without location (still flagged "no GPS").
  // body null: opened from the banner, help only.
  function locSheet(body, code) {
    var l = lang(), other = l === 'es' ? 'en' : 'es';
    var why = code === 1 || GEO === 'denied' ? 'locBlocked' : 'locNoFix';
    var h = '<div id="locSheet"><h2>&#128205; ' + esc(t('locTitle')) + '</h2><p class="why">' + esc(t(why)) + '</p>' + locHelp(l);
    if (body) {
      var w = body.action === 'out' ? 'withoutOut' : body.action === 'switch' ? 'withoutSw' : 'withoutIn';
      h += '<button type="button" class="btn in" id="locRetry">' + esc(t('tryAgain')) + '</button>' +
           '<button type="button" class="btn grey" id="locCancel">' + esc(t('cancel')) + '</button>' +
           '<p class="nogps"><a href="#" id="locWithout">' + esc(t(w)) + '</a></p>';
    } else {
      h += '<button type="button" class="btn grey" id="locCancel">' + esc(t('close')) + '</button>';
    }
    h += '<div class="other"><h2>' + esc(t('locTitle', other)) + '</h2><p class="why">' + esc(t(why, other)) + '</p>' + locHelp(other) + '</div></div>';
    $('sheet').innerHTML = h;
    $('modal').className = 'modal show';
    $('sheet').scrollTop = 0;
    $('locCancel').onclick = closeSheet;
    if (body) {
      $('locRetry').onclick = function() { act(body, this); };
      $('locWithout').onclick = function(ev) { ev.preventDefault(); if (!busy) save(body, null, $('locRetry'), esc(t('tryAgain'))); };
    }
  }

  function openOutSheet() {
    var o = STATE.open;
    $('sheet').innerHTML = '<h2>' + esc(t('outOf')) + ' ' + esc(o.jobNumber) + ' ' + esc(o.jobName) + '</h2>' +
      '<div class="meta">' + esc(t('since')) + ' ' + esc(o.inTime) + ' · ' + fmtH(liveHours()) + ' ' + esc(t('hours')) + '</div>' +
      '<button type="button" class="btn out" id="doOut">' + esc(t('clockOut')) + '</button>' +
      '<button type="button" class="btn grey" id="doCancel">' + esc(t('cancel')) + '</button>';
    $('modal').className = 'modal show';
    $('doCancel').onclick = closeSheet;
    $('doOut').onclick = function() { act({ action: 'out' }, this); };
  }

  function openSwitchSheet() {
    picked = null; manualPick = false; window._q = ''; pickMode = 'switch';
    applyAuto();
    $('sheet').innerHTML = '<h2>' + esc(t('switchTo')) + '</h2>' + picker() +
      '<button type="button" class="btn sw" id="doSwitch"' + (picked ? '' : ' disabled') + '>' + esc(t('switchJob')) + (picked ? ': ' + esc(picked.number) : '') + '</button>' +
      '<button type="button" class="btn grey" id="doCancel">' + esc(t('cancel')) + '</button>';
    $('modal').className = 'modal show';
    $('doCancel').onclick = closeSheet;
    $('doSwitch').onclick = function() {
      if (!picked) return;
      act({ action: 'switch', jobNumber: picked.number }, this);
    };
  }

  function closeSheet() {
    var wasSwitch = pickMode === 'switch';
    $('modal').className = 'modal'; $('sheet').innerHTML = ''; pickMode = 'in';
    if (wasSwitch) { picked = null; manualPick = false; window._q = ''; }
  }

  function setState(s) { STATE = s; STATE._receivedAt = Date.now(); render(); }

  // ---------------- events ----------------
  document.addEventListener('click', function(ev) {
    var b = ev.target.closest && ev.target.closest('button');
    if (!b || busy) return;
    if (b.hasAttribute('data-lang')) { setLang(b.getAttribute('data-lang')); return; }
    if (b.hasAttribute('data-job')) {
      var num = b.getAttribute('data-job');
      // Tapping the job that was already pre-selected for you keeps it "auto".
      if (!(picked && picked.number === num && !manualPick)) manualPick = true;
      picked = jobByNumber(num);
      refreshLists();
      return;
    }
    if (b.id === 'btnIn' && picked) { act({ action: 'in', jobNumber: picked.number }, b); return; }
    if (b.id === 'btnOut') { openOutSheet(); return; }
    if (b.id === 'btnSwitch') { openSwitchSheet(); return; }
    if (b.id === 'locBanner') { locSheet(null, GEO === 'denied' ? 1 : 2); return; }
  });
  document.addEventListener('input', function(ev) {
    if (ev.target && ev.target.id === 'jobSearch') { window._q = ev.target.value; refreshLists(); }
  });

  function load(first) {
    if (!T) { STATE = { invalid: true }; render(); return; }
    apiGet().then(function(s) {
      if (busy) return;
      setState(s);
    }).catch(function() {
      if (first) $('app').innerHTML = header() + '<div class="msg">' + esc(t('loadfail')) + '</div>';
    });
  }
  // Fresh state when the page comes back to the front (another phone, or a long gap).
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && STATE && !busy && $('modal').className === 'modal') load(false);
  });
  document.documentElement.lang = lang();
  if (T) startGeo();
  load(true);
</script>
</body>
</html>
